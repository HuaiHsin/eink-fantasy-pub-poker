<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker RPG: Config Edition</title>
    <style>
        /* === 1. 基礎設定 (預設：高對比彩色) === */
        :root {
            --bg: #ffffff;
            --ink: #000000;
            --paper: #ffffff;
            --zone-bg: #f4f4f4;
            /* 稍微深一點的灰，增加區域對比 */
            --border: 3px solid var(--ink);
            --shadow: 4px 4px 0px rgba(0, 0, 0, 0.2);
            --red-suit: #cc0000;
            /* 深紅色，黑白機顯示為深灰 */
            --btn-hover: #e0e0e0;
        }

        /* [新增] 黑白模式 (B&W Mode) - 強制純黑白灰，適合電子紙 */
        body.bw-mode {
            --bg: #ffffff;
            --ink: #000000;
            --paper: #ffffff;
            --zone-bg: #e8e8e8;
            /* 更明顯的灰階區隔 */
            --shadow: 4px 4px 0px #000000;
            /* 實心黑影，無透明度 */
            --red-suit: #000000;
            /* 紅心方塊變黑色 (靠圖案區分) */
            --btn-hover: #000000;
        }

        /* 讓黑白模式下的按鈕 Hover 變成反白 */
        body.bw-mode button.game-btn:active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
            transform: translateY(4px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Courier New", monospace;
            background: var(--bg);
            color: var(--ink);
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hidden {
            display: none !important;
        }

        .center {
            text-align: center;
        }

        .bold {
            font-weight: 900;
        }

        /* === UI 元件 === */
        .relic-stars {
            font-size: 10px;
            color: #ffd700;
        }

        .stone-box {
            border: var(--border);
            padding: 12px;
            margin-bottom: 12px;
            background: var(--paper);
            box-shadow: var(--shadow);
            position: relative;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: var(--zone-bg);
            border-top: 2px solid #ccc;
        }

        button.game-btn {
            flex: 1;
            padding: 16px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 900;
            background: white;
            border: 3px solid black;
            border-radius: 6px;
            box-shadow: 0 4px 0 black;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        button.game-btn:active {
            transform: translateY(4px);
            box-shadow: none;
            background: black !important;
            color: white !important;
            border-color: black !important;
        }

        button.game-btn:disabled {
            opacity: 0.4;
            border-style: dashed;
            pointer-events: none;
            box-shadow: none;
            transform: none;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .blink-cursor::after {
            content: " █";
            animation: blink 1s step-end infinite;
        }

        /* [修正] 縮小箭頭大小並調整對齊，避免撐開版面 */
        .turn-arrow {
            display: inline-block;
            animation: blink 1s step-end infinite;
            font-size: 12px;
            /* 強制設為較小字體 */
            vertical-align: middle;
            /* 垂直置中 */
            margin-left: 8px;
            position: relative;
            top: -2px;
        }

        /* === 場景樣式 === */
        #scene-start {
            padding: 20px;
            text-align: center;
        }

        /* [修正] 移除旋轉效果，讓外框變正 */
        .title-box {
            border: 6px double black;
            padding: 15px;
            margin: 10px 0;
            background: white;
            /* transform: rotate(-1deg); 已移除 */
        }

        #scene-map {
            padding: 20px;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAXYwJABAAAA7AAB7G1s2AAAAABJRU5ErkJggg==');
        }

        .wanted-poster {
            border: 4px solid black;
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            position: relative;
            text-align: center;
        }

        .wanted-poster::before {
            content: '📍';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
        }

        .wanted-poster:active {
            transform: translateY(4px);
            background: black;
            color: white;
            box-shadow: none;
        }

        .wanted-poster:active .wanted-title,
        .wanted-poster:active .wanted-reward {
            color: white;
            background: black;
            text-decoration-color: white;
            /* Underline 變白 */
        }

        .wanted-title {
            font-size: 20px;
            font-weight: 900;
            text-decoration: underline;
            margin-bottom: 5px;
        }

        .wanted-reward {
            font-size: 12px;
            background: black;
            color: white;
            display: inline-block;
            padding: 2px 6px;
            margin-top: 5px;
        }

        .event-poster {
            border-color: #444;
            background: #fffdf0;
        }

        .event-poster::before {
            content: '❓';
        }

        .camp-poster {
            border-color: #8b4513;
            background: #fff0e0;
        }

        .camp-poster::before {
            content: '🔥';
        }

        /* === [Damage Popup] 傷害數字飄動 === */
        .damage-popup {
            position: absolute;
            z-index: 200;
            font-size: 28px;
            font-weight: 900;
            font-family: "Courier New", monospace;
            color: black;
            pointer-events: none;

            /* 文字描邊（確保在任何背景上可讀） */
            text-shadow:
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white,
                2px 2px 0 white,
                0 0 4px white;

            /* 基礎飄動動畫 */
            animation: damage-float 0.8s ease-out forwards;

            /* 置中偏移 */
            transform: translateX(-50%);
        }

        @keyframes damage-float {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(0.5);
            }

            15% {
                transform: translateX(-50%) translateY(-15px) scale(1.3);
            }

            30% {
                transform: translateX(-50%) translateY(-20px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-60px) scale(0.8);
            }
        }

        .damage-popup.crit {
            font-size: 36px;
            color: white;
            text-shadow:
                -2px -2px 0 black,
                2px -2px 0 black,
                -2px 2px 0 black,
                2px 2px 0 black,
                0 0 8px black;

            animation: damage-crit 1s ease-out forwards;
        }

        @keyframes damage-crit {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(0.3) rotate(-10deg);
            }

            10% {
                transform: translateX(-50%) translateY(-10px) scale(1.5) rotate(5deg);
            }

            25% {
                transform: translateX(-50%) translateY(-25px) scale(1.2) rotate(-3deg);
            }

            50% {
                transform: translateX(-50%) translateY(-35px) scale(1) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-80px) scale(0.7);
            }
        }

        .damage-popup.heal {
            color: #228B22;
            /* 森林綠 */
            text-shadow:
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white,
                2px 2px 0 white;

            animation: heal-float 0.8s ease-out forwards;
        }

        @keyframes heal-float {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(10px) scale(0.8);
            }

            20% {
                opacity: 1;
                transform: translateX(-50%) translateY(-10px) scale(1.1);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-50px) scale(1);
            }
        }

        /* 黑白模式下治療用灰色區分 */
        body.bw-mode .damage-popup.heal {
            color: #666;
        }

        .damage-popup.text-only {
            font-size: 18px;
            letter-spacing: 2px;
            animation: status-pop 0.6s ease-out forwards;
        }

        @keyframes status-pop {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.5);
            }

            30% {
                opacity: 1;
                transform: translateX(-50%) scale(1.2);
            }

            60% {
                transform: translateX(-50%) scale(0.95);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) scale(1) translateY(-30px);
            }
        }

        /* Battle Scene */
        #scene-battle {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ddd;
            position: relative;
        }

        .zone-enemy {
            background-color: var(--zone-bg);
            background-image:
                radial-gradient(#bbb 1px, transparent 1px),
                radial-gradient(#bbb 1px, transparent 1px);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            padding: 10px;
            border-bottom: 2px solid #999;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            /* 防止裝飾溢出 */
        }

        .enemy-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 15px;
            position: relative;
        }

        .scene-decorator {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.8;
            flex: 1;
            /* 讓裝飾區域撐開 */
        }

        #e-scene-l {
            justify-content: flex-end;
            margin-right: -5px;
        }

        #e-scene-r {
            justify-content: flex-start;
            margin-left: -5px;
        }

        .scene-decorator span {
            font-family: monospace;
            opacity: 0.5;
        }

        /* 小仙女的考驗 - 題目卡片 */
        .puzzle-question {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            margin-top: 10px;
        }

        .puzzle-card {
            width: 48px !important;
            height: 68px !important;
            min-width: 48px !important;
            font-size: 13px !important;
            pointer-events: none;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
        }

        .puzzle-card .rank-txt,
        .puzzle-card .rank-bot {
            font-size: 13px !important;
        }

        .puzzle-card .suit-big {
            font-size: 24px !important;
        }

        /* 射龍門專用大牌 */
        .dragon-gate-card {
            width: 80px !important;
            height: 115px !important;
            min-width: 80px !important;
            font-size: 18px !important;
            pointer-events: none;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.25);
        }

        .dragon-gate-card .rank-txt,
        .dragon-gate-card .rank-bot {
            font-size: 18px !important;
            font-weight: 900;
        }

        .dragon-gate-card .suit-big {
            font-size: 38px !important;
        }

        .dragon-gate-cards {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 4px;
        }

        .puzzle-blank {
            border: 2px dashed #999 !important;
            background: #f9f9f9 !important;
            animation: puzzle-pulse 1.5s ease-in-out infinite;
        }

        .puzzle-title-frame {
            order: -1;
            margin-bottom: 10px;
        }

        .puzzle-mode-only {
            display: none;
        }

        .puzzle-hide {
            display: none !important;
        }

        @keyframes puzzle-pulse {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        .zone-table {
            flex: 1;
            background: #fff;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 10px 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .zone-player {
            background-color: var(--zone-bg);
            background-image:
                radial-gradient(#bbb 1px, transparent 1px),
                radial-gradient(#bbb 1px, transparent 1px);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            padding: 10px 10px 0 10px;
            border-top: 2px solid #999;
        }

        /* === [優化] 頂部狀態列樣式 === */
        .battle-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .status-pill {
            border: 2px solid black;
            background: white;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .status-label {
            background: black;
            color: white;
            padding: 0 4px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .field-icon {
            font-size: 24px;
            /* 加大圖示 */
            font-weight: bold;
        }

        .field-info {
            font-size: 16px;
            font-weight: 900;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .hp-frame {
            width: 100%;
            height: 20px;
            border: 2px solid black;
            background: white;
            position: relative;
            margin-top: 2px;
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s;
            background: repeating-linear-gradient(-45deg, #000, #000 4px, #333 4px, #333 8px);
        }

        .hp-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            mix-blend-mode: difference;
        }

        /* Card Area */
        .card-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 6px;
            flex: 1;
        }

        .card {
            width: 23%;
            aspect-ratio: 0.72;
            border: 2px solid black;
            border-radius: 4px;
            background: white;
            position: relative;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .card-placeholder {
            width: 23%;
            aspect-ratio: 0.72;
            border: 2px dashed #bbb;
            border-radius: 4px;
        }

        .card.selected {
            background: black;
            color: white;
            transform: translateY(-5px);
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            outline: 2px solid black;
        }

        .card.selected .suit-red,
        .card.selected .suit-black {
            color: white !important;
        }

        .card.disabled {
            opacity: 0.2;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .suit-big {
            font-size: 32px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .rank-txt {
            font-size: 16px;
            font-weight: 900;
            position: absolute;
            top: 2px;
            left: 4px;
        }

        .rank-bot {
            font-size: 16px;
            font-weight: 900;
            position: absolute;
            bottom: 2px;
            right: 4px;
            transform: rotate(180deg);
        }

        .joker-txt {
            font-size: 10px;
            font-weight: 900;
            position: absolute;
            top: 2px;
            left: 2px;
        }

        .joker-bot {
            font-size: 10px;
            font-weight: 900;
            position: absolute;
            bottom: 2px;
            right: 2px;
            transform: rotate(180deg);
        }

        /* [修正] 使用變數控制紅色 */
        .suit-red {
            color: var(--red-suit);
            font-weight: 900;
        }

        .suit-black {
            color: var(--ink);
        }

        .card-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: white;
            border: 1px solid black;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            line-height: 16px;
            text-align: center;
            z-index: 5;
        }

        #msg-box {
            background: black;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            border-radius: 4px;
            min-height: 28px;
        }

        .relic-bar {
            display: flex;
            gap: 4px;
            justify-content: center;
            min-height: 24px;
            margin: 4px 0;
            flex-wrap: wrap;
        }

        .relic-icon {
            width: 24px;
            height: 24px;
            border: 1px solid black;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 1px 1px 0px #999;
            cursor: pointer;
            position: relative;
            /* [新增] 為了讓數量疊加顯示 */
        }

        /* [新增] 遺物疊加數量標籤 */
        .relic-count {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: black;
            color: white;
            font-size: 9px;
            padding: 0 2px;
            border: 1px solid white;
            line-height: 1;
            font-weight: bold;
            z-index: 10;
        }

        /* Event Scene */
        #scene-event {
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #fffaf0;
        }

        .event-image {
            font-size: 60px;
            text-align: center;
            margin: 20px 0;
        }

        .event-text {
            font-size: 16px;
            line-height: 1.6;
            border: 3px solid black;
            padding: 20px;
            background: white;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px #ccc;
            flex: 1;
        }

        /* 混合模式：當同時有純文字敘述與對話框時，縮減敘述框以釋放高度 */
        #scene-event.has-chat {
            padding: 12px;
        }
        #scene-event.has-chat .event-image {
            font-size: 40px;
            margin: 8px 0;
        }
        #scene-event.has-chat .event-text {
            flex: none;
            margin-bottom: 10px;
            padding: 12px 15px;
            font-size: 14px;
        }

        .event-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        /* Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            border: 4px double black;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.2);
        }

        .kao {
            font-size: 20px;
            font-weight: 900;
            white-space: pre;
            letter-spacing: -1px;
        }

        .ascii-art {
            font-size: 6px;
            line-height: 6px;
            text-align: left;
            overflow: hidden;
            width: 100%;
            display: flex;
            justify-content: center;
            font-weight: bold;
        }

        /* === [新增] 對話事件專用樣式 === */
        .chat-box {
            flex: 1;
            border: 3px solid black;
            background: white;
            padding: 15px;
            margin: 10px 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chat-row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
            width: 100%;
        }

        .chat-row.right {
            align-items: flex-end;
        }

        .chat-tag {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #eee;
            border: 2px solid black;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
            height: fit-content;
        }

        .chat-row.right .chat-tag {
            background: #e0f0ff;
        }

        .chat-msg {
            font-size: 14px;
            line-height: 1.5;
            padding: 8px 12px;
            border: 2px solid black;
            border-radius: 8px;
            background: white;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
            max-width: 85%;
            word-break: break-all;
        }

        .chat-row.right .chat-msg {
            background: #f5f5f5;
        }

        /* 隱藏舊的元素用 */
        .hidden-in-chat {
            display: none !important;
        }

        /* === [新增] 牌型說明格線與迷你卡樣式 === */
        .guide-container {
            border: 2px solid black;
            margin-top: 10px;
        }

        .guide-row {
            display: flex;
            border-bottom: 1px solid black;
            align-items: center;
        }

        .guide-row:last-child {
            border-bottom: none;
        }

        // Config Placeholders (Will be loaded from bottom)

            FIELD_FACTORS: [

                { id: 'd_up', name: 'Dia+', rate: 1.5, suit: 'd', icon: '♦', desc: { en: 'Diamonds Stronger', zh: '方塊增強' } },
                { id: 'h_up', name: 'Hrt+', rate: 1.5, suit: 'h', icon: '♥', desc: { en: 'Hearts Stronger', zh: '紅心增強' } },
                { id: 's_up', name: 'Spd+', rate: 1.5, suit: 's', icon: '♠', desc: { en: 'Spades Stronger', zh: '黑桃增強' } },
                // [新增] 異常場地 (Anomalies)
                { id: 'fog', name: 'Fog', rate: 1.0, suit: null, icon: '🌫️', special: 'blind', desc: { en: 'Blind Cards', zh: '濃霧：點數隱藏' } },
                { id: 'thorns', name: 'Thorns', rate: 1.0, suit: null, icon: '🌵', special: 'pain', desc: { en: 'Play = Hurt', zh: '荊棘：出牌自傷' } },
                { id: 'grav', name: 'Gravity', rate: 0.5, suit: null, icon: '⚓', special: 'heavy', desc: { en: 'High Cards Weak', zh: '重力：大牌虛弱' } },
                { id: 'wind', name: 'Storm', rate: 1.0, suit: null, icon: '🌀', special: 'shuffle', desc: { en: 'Auto Shuffle', zh: '暴風：每回洗牌' } }
            ],
            AI_TYPES: { RANDOM: '🎲 Random', LOW: '⬇️ Low', HIGH: '⬆️ High', MAX_HAND: '★ Max', MIN_HAND: '▫️ Min' },
            HAND_SCORES: { 'Five of a Kind': [150, 10], 'Straight Flush': [100, 8], 'Four of a Kind': [60, 7], 'Full House': [40, 4], 'Flush': [35, 4], 'Straight': [30, 4], 'Three of a Kind': [30, 3], 'Two Pair': [20, 2], 'Pair': [10, 2], 'High Card': [5, 1] },
            SCENE_DECORATORS: [
                { range: [1, 5], l: '🌲🌳', r: '🌳🌲', line: '───' },
                { range: [6, 10], l: '🌑🦇', r: '🦇🌑', line: '═══' },
                { range: [11, 15], l: '🏰🏯', r: '🏯🏰', line: '──¤' },
                { range: [16, 20], l: '🌋🔥', r: '🔥🌋', line: '──🔥' },
                { range: [21, 999], l: '🌌✨', r: '✨🌌', line: '──◈' }
            ]
        };

        // 牌型名稱對照表 (用於翻譯)
        const HAND_KEY_MAP = {
            'Five of a Kind': 'HAND_5KIND', 'Straight Flush': 'HAND_STR_FLUSH', 'Four of a Kind': 'HAND_4KIND',
            'Full House': 'HAND_FULL', 'Flush': 'HAND_FLUSH', 'Straight': 'HAND_STRAIGHT',
            'Three of a Kind': 'HAND_3KIND', 'Two Pair': 'HAND_2PAIR', 'Pair': 'HAND_PAIR', 'High Card': 'HAND_HIGH'
        };

        const Utils = {
            randInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            pick: arr => arr[Math.floor(Math.random() * arr.length)],
            // [新增] 基於權重的隨機選擇
            weightedPick: (arr) => {
                // 如果沒有權重屬性，退回到普通隨機
                if (!arr[0] || arr[0].weight === undefined) {
                    return Utils.pick(arr);
                }

                // 計算總權重
                const totalWeight = arr.reduce((sum, item) => sum + (item.weight || 1.0), 0);

                // 隨機選擇
                let random = Math.random() * totalWeight;
                for (const item of arr) {
                    random -= (item.weight || 1.0);
                    if (random <= 0) {
                        return item;
                    }
                }
                return arr[arr.length - 1]; // 容錯返回最後一個
            },
            // [修正P3] 改用 Fisher-Yates 洗牌演算法，確保分佈均勻
            shuffle: arr => {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            },
            delay: ms => new Promise(res => setTimeout(res, ms)),
            chance: prob => Math.random() < prob
        };

        const Generator = {
            genEnemy: function (stage) {
                const isElite = (stage % 5 === 0); // 每 5 層固定菁英
                const scale = Math.pow(1.15, stage - 1); // 基礎指數成長

                // 1. 基礎數值 [修正] 調降攻擊力，避免秒殺
                let hp = Math.floor(200 * scale * (isElite ? 1.5 : 1));
                let atk = Math.floor((6 + stage * 0.7) * (isElite ? 1.2 : 1));
                let cd = isElite ? Utils.randInt(2, 3) : 4;

                // 2. 名稱生成
                const adj = Utils.pick(C_MONSTER_NAMES.Adj);
                const noun = Utils.pick(C_MONSTER_NAMES.Noun);
                let nameEn = `${adj.en} ${noun.en}`;
                let nameZh = `${adj.zh}${noun.zh}`;

                // 3. [新增] 詞綴系統 (Floor 3 開始出現，機率 40% + 層數加成)
                let prefix = null;
                if (stage >= 3 && (Utils.chance(0.4 + (stage * 0.02)) || isElite)) {
                    prefix = Utils.pick(C_MONSTER_PREFIX);
                    // 套用詞綴修正
                    hp = Math.floor(hp * prefix.mod.hp);
                    atk = Math.floor(atk * prefix.mod.atk);
                    cd = Math.max(1, cd + prefix.mod.cd); // CD 至少為 1

                    // 組合新名字
                    nameEn = `${prefix.en} ${nameEn}`;
                    nameZh = `${prefix.zh}${noun.zh}`;
                }

                const name = { en: nameEn, zh: nameZh };

                // 4. AI 演進 (越後期越聰明)
                let ai = Data.AI_TYPES.RANDOM;
                if (stage > 3) ai = Utils.pick([Data.AI_TYPES.LOW, Data.AI_TYPES.HIGH]);
                if (stage > 8) ai = Data.AI_TYPES.HIGH;
                if (stage > 12 || isElite) ai = Data.AI_TYPES.MAX_HAND;

                // 5. 顏文字生成
                const bp = Utils.pick(C_MONSTER_PARTS.Brackets);
                const face = `${bp[0]}${Utils.pick(C_MONSTER_PARTS.Eye)}${Utils.pick(C_MONSTER_PARTS.Mouth)}${Utils.pick(C_MONSTER_PARTS.Eye)}${bp[1]}`;
                const kao = (isElite ? '👑' : '') + (prefix ? '⚡' : '') + face;

                // 6. 技能生成 (後期機率增加)
                let skill = null;
                if (Utils.chance(isElite ? 1.0 : (stage > 3 ? 0.4 : 0.0))) skill = Utils.pick(C_SKILLS);

                // 7. [新增] 特性生成 (5層後開始，20%機率，菁英必定有)
                let trait = null;
                if (stage >= 5 && (Utils.chance(0.2) || isElite)) {
                    const suitList = ['s', 'h', 'd', 'c'];
                    const traitType = Utils.pick(['immune', 'weakness']);
                    const traitSuit = Utils.pick(suitList);
                    trait = { type: traitType, suit: traitSuit };
                }

                return { id: Math.random(), name, kao, hp, maxHp: hp, atk, cd, maxCd: cd, ai, isElite, skill, trait };
            }
        };

        const BuffSys = {
            activeBuffs: [],
            add: function (type, val, duration, name) {
                let existing = this.activeBuffs.find(b => b.type === type && b.val === val);
                if (existing) existing.duration = duration; else this.activeBuffs.push({ type, val, duration, name });
                Game.renderBuffs();
            },
            tick: function () { this.activeBuffs.forEach(b => b.duration--); this.activeBuffs = this.activeBuffs.filter(b => b.duration > 0); Game.renderBuffs(); },
            clear: function () { this.activeBuffs = []; },
            isSuitBanned: function (suit) { return this.activeBuffs.some(b => b.type === 'ban_suit' && b.val === suit); },
            isDiscardBanned: function () { return this.activeBuffs.some(b => b.type === 'no_disc'); },
            isWeak: function () { return this.activeBuffs.some(b => b.type === 'weak'); }
        };

        const Game = {
            state: { stage: 1, storyIndex: 0, p_hp: 100, p_max: 100, baseMaxHp: 100, deck: [], table: [], selected: [], enemy: null, field: null, turn: 'player', relics: [], discLeft: 3, rewardPicks: 0, tableMax: 8, hint: "", trainBonus: 0, logs: [], turnCount: 1, maxDmg: 0, killCount: 0, startTime: null, battleStats: { totalDamage: 0, handsPlayed: {}, discardsUsed: 0, turnsPlayed: 0, startTime: null }, retryCount: 3, lastBattleEnemy: null, gold: 50, handsPlayedInBattle: {}, auras: { windrunner: false, element: false, echo: false }, puppyHealed: false, chefDefeated: false, masterChefDefeated: false, masterChefBattle: false },

            // [優化P3] 抽取玩家顏文字邏輯為 helper method
            getPlayerKao: function () {
                const pct = this.state.p_hp / this.state.p_max;
                return C_VISUALS.Kaomoji.Player[pct <= 0 ? 0 : pct < 0.3 ? 3 : pct < 0.6 ? 2 : 1];
            },

            // [優化P3] 抽取遺物分組邏輯為 helper method
            getGroupedRelics: function () {
                const grouped = {};
                this.state.relics.forEach(r => {
                    if (!grouped[r.id]) {
                        grouped[r.id] = { ...r, count: 0 };
                    }
                    grouped[r.id].count++;
                });
                return grouped;
            },

            init: function () {
                this.state.stage = 1;
                this.state.p_hp = 100;
                this.state.p_max = 100;
                this.state.baseMaxHp = 100; // [新增] 追蹤基礎最大HP（不含遺物加成）
                this.state.trainBonus = 0;
                this.state.relics = [];
                this.state.storyIndex = 0;
                this.state.retryCount = 3; // [新增] 重置重試次數
                this.state.lastBattleEnemy = null; // [新增] 清除上次戰鬥記錄
                this.state.gold = 50;
                this.state.handsPlayedInBattle = {};
                this.state.auras = { windrunner: false, element: false, echo: false };
                this.state.puppyHealed = false;
                this.state.chefDefeated = false;
                this.state.masterChefDefeated = false;
                this.state.masterChefBattle = false;
                BuffSys.clear();


                document.querySelectorAll('.modal').forEach(e => e.classList.add('hidden'));
                document.getElementById('cover-art').innerText = C_VISUALS.CoverArt;

                // [UI] 更新標題與按鈕文字
                document.querySelector('.title-box p').innerText = T('TITLE_SUB');
                document.querySelector('button[onclick="Game.startGame()"]').innerText = T('BTN_START');
                // 如果有加這兩顆按鈕的話
                const btnRules = document.querySelector('button[onclick="Game.toggleRules()"]');
                if (btnRules) btnRules.innerText = T('BTN_RULES');
                const btnColor = document.querySelector('button[onclick="Game.toggleColor()"]');
                if (btnColor) btnColor.innerText = T('BTN_COLOR');

                this.showScene('scene-start');
            },

            startGame: function () {
                this.state.startTime = Date.now();
                this.state.maxDmg = 0;
                this.state.killCount = 0;
                this.state.storyIndex = 0;

                if (USE_STORY_MODE) {
                    // [新增] 劇情模式直接從第 4 層開始，跳過教學關
                    this.state.stage = 4;
                    this.nextStoryStep();
                } else {
                    // 非劇情模式，從第 1 層開始（包含教學關）
                    this.state.stage = 1;
                    this.genMap();
                }
            },
            // 事件結果點擊 CONTINUE 後
            confirmEventResult: function () {
                document.getElementById('modal-event-result').classList.add('hidden');
                // [修正] 如果有待處理的戰鬥，不要推進流程（等待 setTimeout 觸發戰鬥）
                if (this.state.pendingBattle) {
                    this.state.pendingBattle = false;
                    return;
                }
                // [修正] 優先檢查劇情模式
                if (USE_STORY_MODE && this.state.storyIndex < C_STORY_FLOW.length) {
                    // 劇情還在進行中，繼續下一步
                    this.nextStoryStep();
                } else {
                    // [重要修正] 劇情已結束或非劇情模式，正常增加層數
                    if (USE_STORY_MODE && this.state.stage < 4) {
                        // 劇情剛結束，跳過教學關，直接到第 4 層
                        this.state.stage = 4;
                    } else {
                        this.state.stage++;
                    }
                    this.genMap();
                }
            },

            createBaseDeck: function () {
                let d = []; let id = 0;
                for (let s of SUITS) {
                    for (let r of RANKS) {
                        d.push({ suit: s, rank: r, val: Data.VALUES[r], id: id++, enchant: null });
                    }
                }
                d.push({ suit: 'j', rank: 'JO', val: 15, id: id++, enchant: null });
                d.push({ suit: 'j', rank: 'JO', val: 15, id: id++, enchant: null });
                return d;
            },

            enterShop: function () {
                this.showScene('scene-shop');
                this.renderShop();
            },

            renderShop: function () {
                document.getElementById('shop-gold').innerText = this.state.gold;
                const list = document.getElementById('shop-list');
                list.innerHTML = '';

                // 1. 隨機遺物 (Random Relic)
                this.createShopItem(list, "🎁", { en: "Random Relic", zh: "隨機遺物" }, { en: "Buy a random passive relic", zh: "隨機獲得一個被動遺物" }, 150, () => {
                    this.buyRandomRelic();
                });

                // 2. 卡牌附魔 (Card Enchantment)
                this.createShopItem(list, "🎴", { en: "Card Enchantment Scroll", zh: "卡牌附魔卷軸" }, { en: "Enchant a card in your deck with power", zh: "為牌庫中的一張牌添加強力附魔效果" }, 100, () => {
                    this.openDeckSelect('enchant');
                });

                // 3. 移除卡牌 (Deck Thinning)
                this.createShopItem(list, "🗑️", { en: "Card Removal Service", zh: "移除爛牌服務" }, { en: "Permanently delete a card from your deck", zh: "從牌庫中永久刪除一張卡牌（精簡牌組）" }, 75, () => {
                    this.openDeckSelect('remove');
                });

                // 4. 生命藥水 (Ankh Potion)
                this.createShopItem(list, "🧪", { en: "Ankh Potion (Heal 35 HP)", zh: "生命藥水 (恢復 35 HP)" }, { en: "Instantly restore 35 Health points", zh: "立刻恢復 35 點生命值" }, 50, () => {
                    this.buyAnkhPotion();
                });
            },

            createShopItem: function (parent, icon, name, desc, cost, onBuy) {
                const el = document.createElement('div');
                el.className = 'stone-box';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'space-between';
                el.style.padding = '12px';
                el.style.marginBottom = '6px';
                el.style.background = 'white';

                const canAfford = this.state.gold >= cost;

                el.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px; flex: 1; text-align: left;">
                        <span style="font-size: 32px;">${icon}</span>
                        <div>
                            <b style="font-size: 16px;">${T(name)}</b>
                            <div style="font-size: 12px; color: #555; margin-top: 2px;">${T(desc)}</div>
                        </div>
                    </div>
                    <button class="game-btn" ${canAfford ? '' : 'disabled'} style="flex: 0 0 100px; padding: 10px; font-size: 14px; margin-left: 10px;">
                        💰 ${cost}G
                    </button>
                `;

                const btn = el.querySelector('button');
                btn.onclick = onBuy;
                parent.appendChild(el);
            },

            buyRandomRelic: function () {
                if (this.state.gold < 150) return;
                this.state.gold -= 150;
                this.addRandomRelic();
                const relic = this.state.relics[this.state.relics.length - 1];
                const msg = USER_LANG === 'zh' ? `購買成功！獲得了 [${T(relic.name)}]。` : `Purchased successfully! Gained [${T(relic.name)}].`;
                this.renderShop();
                this.showEventResult(msg);
            },

            buyAnkhPotion: function () {
                if (this.state.gold < 50) return;
                this.state.gold -= 50;
                this.state.p_hp = Math.min(this.state.p_hp + 35, this.state.p_max);
                const msg = USER_LANG === 'zh' ? "購買成功！生命恢復了 35 點。" : "Purchased successfully! Restored 35 HP.";
                this.renderShop();
                this.showEventResult(msg);
            },

            leaveShop: function () {
                if (USE_STORY_MODE && this.state.storyIndex < C_STORY_FLOW.length) {
                    this.nextStoryStep();
                } else {
                    if (this.state.stage < 4) {
                        this.state.stage = 4;
                    } else {
                        this.state.stage++;
                    }
                    this.genMap();
                }
            },

            openDeckSelect: function (mode) {
                this.state.deckSelectMode = mode;
                document.getElementById('modal-deck-select').classList.remove('hidden');
                this.renderDeckSelectList();
            },

            closeDeckSelect: function () {
                document.getElementById('modal-deck-select').classList.add('hidden');
                this.state.deckSelectMode = null;
            },

            renderDeckSelectList: function () {
                const list = document.getElementById('deck-select-list');
                list.innerHTML = '';

                if (!this.state.customDeck) this.state.customDeck = this.createBaseDeck();

                this.state.customDeck.forEach((card, idx) => {
                    const el = document.createElement('div');
                    const meta = Data.SUIT_META[card.suit];

                    el.className = 'card';
                    el.style.width = '70px';
                    el.style.height = '100px';
                    el.style.fontSize = '12px';
                    el.style.margin = '4px';

                    let enchantTag = '';
                    if (card.enchant) {
                        const encSymbol = card.enchant === 'gold' ? 'G' : card.enchant === 'glass' ? 'X' : card.enchant === 'steel' ? 'S' : 'M';
                        enchantTag = `<div class="card-badge" style="background: black; color: white;">${encSymbol}</div>`;
                    }

                    if (card.rank === 'JO') {
                        el.innerHTML = `${enchantTag}<div class="joker-txt" style="font-size:8px;">JOKER</div><div class="suit-big" style="font-size:24px;">🃏</div><div class="joker-bot" style="font-size:8px;">JOKER</div>`;
                    } else {
                        el.innerHTML = `${enchantTag}<div class="rank-txt ${meta.style}" style="font-size:12px; top:2px; left:4px;">${card.rank}</div><div class="suit-big ${meta.style}" style="font-size:24px;">${meta.sym}</div><div class="rank-bot ${meta.style}" style="font-size:12px; bottom:2px; right:4px;">${card.rank}</div>`;
                    }

                    el.onclick = () => this.selectCardFromDeck(idx);
                    list.appendChild(el);
                });
            },

            selectCardFromDeck: function (idx) {
                const mode = this.state.deckSelectMode;
                const card = this.state.customDeck[idx];

                if (mode === 'remove') {
                    if (this.state.customDeck.length <= 5) {
                        alert(USER_LANG === 'zh' ? "牌數太少，不能再移除了！" : "Deck is too small to remove more cards!");
                        return;
                    }
                    this.state.customDeck.splice(idx, 1);
                    this.state.gold -= 75;
                    this.closeDeckSelect();
                    this.renderShop();
                    const msg = USER_LANG === 'zh' ? `已移除 [${card.rank}${Data.SUIT_META[card.suit].sym}]。` : `Removed [${card.rank}${Data.SUIT_META[card.suit].sym}].`;
                    this.showEventResult(msg);
                } else if (mode === 'enchant') {
                    const enchants = ['gold', 'glass', 'steel', 'spectral'];
                    const chosen = Utils.pick(enchants);
                    card.enchant = chosen;
                    this.state.gold -= 100;
                    this.closeDeckSelect();
                    this.renderShop();
                    
                    const enchantNames = {
                        gold: { en: "Gold [G]", zh: "黃金 [G]" },
                        glass: { en: "Glass [X]", zh: "玻璃 [X]" },
                        steel: { en: "Steel [S]", zh: "鋼鐵 [S]" },
                        spectral: { en: "Spectral [M]", zh: "鬼魅 [M]" }
                    };
                    const msg = USER_LANG === 'zh' ? `附魔成功！[${card.rank}${Data.SUIT_META[card.suit].sym}] 獲得了 ${T(enchantNames[chosen])} 屬性。` : `Enchantment successful! [${card.rank}${Data.SUIT_META[card.suit].sym}] gained ${T(enchantNames[chosen])}.`;
                    this.showEventResult(msg);
                }
            },

            getRelicBonus: function () { let bonus = { chip: 0, mult: 0, disc: 0, hp: 0 }; this.state.relics.forEach(r => { for (let k in r.effect) bonus[k] += r.effect[k]; }); return bonus; },
            hasRelic: function (id) { return this.state.relics.some(r => r.id === id); },
            getRelicCount: function (id) { return this.state.relics.filter(r => r.id === id).length; },
            // [新增] 劇情進度管理器
            nextStoryStep: function () {
                if (!USE_STORY_MODE || this.state.storyIndex >= C_STORY_FLOW.length) {
                    // [關鍵修正] 如果剛結束劇情模式，直接跳到第 4 層 (避開 1~3 層的教學固定關)
                    if (this.state.stage < 4) {
                        this.state.stage = 4;
                    } else {
                        this.state.stage++;
                    }
                    this.genMap();
                    return;
                }

                const step = C_STORY_FLOW[this.state.storyIndex];
                this.state.storyIndex++; // 推進索引

                if (step.type === 'event') {
                    const evt = C_EVENTS.find(e => e.id === step.id);
                    this.startEvent(evt);
                } else if (step.type === 'campfire') {
                    this.startEvent(C_CAMPFIRE);
                } else if (step.type === 'battle') {
                    // 進入指定戰鬥，並標記獎勵規則
                    this.state.battleRewardRule = { type: step.rewardType, id: step.fixedRewardId };
                    this.startBattle(step.enemy);
                }
            },

            startEvent: function (evtData) {
                this.showScene('scene-event');

                let actualEvt = { ...evtData };
                if (evtData === C_CAMPFIRE && this.state.puppyHealed && Math.random() < 0.40) {
                    actualEvt = {
                        name: { en: 'Loyal Puppy', zh: '報恩的小狗' },
                        kao: 'ฅ^•ﻌ•^ฅ🦴',
                        text: { 
                            en: 'The injured puppy you helped earlier runs up to you wagging its tail! It has brought a mysterious gift in its mouth...', 
                            zh: '你之前包紮過的小狗開心地跑了過來，對你狂搖尾巴！牠嘴裡叼著一個神秘的禮物送給你……' 
                        },
                        choices: [
                            { text: { en: 'Accept Gift (Gained Bone Relic)', zh: '收下禮物 (獲得小狗骨頭)' }, type: 'get_bone', res: { en: 'The puppy barks happily and nuzzles your hand!', zh: '小狗開心地叫了幾聲，用頭蹭了蹭你的手！' } },
                            { text: { en: 'Share food (Heal 25 HP, +50G)', zh: '分享乾糧 (恢復 25 HP, 獲得 50G)' }, type: 'puppy_share', res: { en: 'The puppy eats happily and leaves some shiny gold coins behind!', zh: '小狗吃得很開心，走之前留下了一些發亮的金幣！' } }

                const sceneEventEl = document.getElementById('scene-event');
                const imgEl = document.getElementById('event-kao');
                const descEl = document.getElementById('event-desc');

                // Let dialogue rendering use actualEvt instead of evtData
                evtData = actualEvt;

                // 判斷是「對話模式」還是「普通模式」
                if (evtData.dialogue) {
                    sceneEventEl.classList.add('has-chat');
                    // === 對話模式 ===
                    chatBox.classList.remove('hidden'); // 顯示對話框
                    chatBox.innerHTML = ''; // 清空舊對話

                    // [新增] 支援「描述 + 對話」混合模式
                    if (evtData.text) {
                        imgEl.classList.remove('hidden');
                        descEl.classList.remove('hidden');
                        imgEl.innerText = evtData.kao;
                        descEl.innerText = T(evtData.text);
                    } else {
                        imgEl.classList.add('hidden'); // 隱藏大頭貼
                        descEl.classList.add('hidden'); // 隱藏純文字框
                    }

                    // [優化P3] 使用 helper method
                    const pKao = this.getPlayerKao();

                    // 生成對話
                    evtData.dialogue.forEach(line => {
                        const row = document.createElement('div');
                        const isPlayer = line.speaker === 'player';

                        // 設定 CSS 樣式 (左邊或右邊)
                        row.className = isPlayer ? 'chat-row right' : 'chat-row left';

                        // [新增] 支援多 NPC 發言者：每行可覆寫 kao 和 name
                        const name = isPlayer ? T('YOU') : (line.name ? T(line.name) : T(evtData.name));
                        const kao = isPlayer ? pKao : (line.kao || evtData.kao);
                        const text = T(line.text);

                        // 組合 HTML: [標籤: 顏文字+名字] + 文字內容
                        row.innerHTML = `
                            <div class="chat-tag">
                                <span style="font-size:14px;">${kao}</span>
                                <span>${name}</span>
                            </div>
                            <div class="chat-msg">${text}</div>
                        `;
                        chatBox.appendChild(row);
                    });

                } else {
                    sceneEventEl.classList.remove('has-chat');
                    // === 普通模式 (舊有邏輯) ===
                    imgEl.classList.remove('hidden');
                    descEl.classList.remove('hidden');
                    chatBox.classList.add('hidden');

                    imgEl.innerText = evtData.kao;
                    descEl.innerText = T(evtData.text);
                }

                // 生成按鈕 (共用邏輯)
                const btnGroup = document.getElementById('event-choices');
                btnGroup.innerHTML = '';
                evtData.choices.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn';
                    btn.innerText = T(c.text);
                    btn.onclick = () => this.resolveEventChoice(c);
                    btnGroup.appendChild(btn);
                });
            },

            resolveEventChoice: function (choice) {
                let msg = T(choice.res);
                switch (choice.type) {
                    case 'hp': case 'relic_pain':
                        // [修正P2] 加入下限保護，避免 HP 變負數
                        this.state.p_hp = Math.max(0, this.state.p_hp + choice.val);
                        if (choice.type === 'relic_pain') this.addRandomRelic();
                        break;
                    case 'lose_relic':
                        if (this.state.relics.length > 0) {
                            const lost = this.state.relics.pop();
                            msg += ` (${T('LOST')}: ${T(lost.name)})`;
                        } else {
                            msg = USER_LANG === 'zh' ? "你沒東西可偷！" : "You had nothing to steal!";
                        }
                        break;
                    case 'hp_buff':
                        // [修正P2] 加入下限保護
                        this.state.p_hp = Math.max(0, this.state.p_hp + choice.val);
                        BuffSys.add('bless', null, 5, 'BLESS');
                        break;
                    case 'heal': case 'camp_rest':
                        let heal = choice.val || Math.floor(this.state.p_max * 0.3);
                        this.state.p_hp = Math.min(this.state.p_hp + heal, this.state.p_max);
                        msg += ` (${T('HP_REC')}: +${heal})`;
                        this.showDamagePopup(heal, 'p-kao', { isHeal: true });
                        break;
                    case 'camp_train':
                        this.state.trainBonus += 10;
                        break;
                    case 'gamble':
                        if (Math.random() < 0.5) {
                            this.addRandomRelic();
                            msg = USER_LANG === 'zh' ? "幸運！你找到了寶物！" : "Lucky! You found a relic inside!";
                        } else {
                            // [修正P2] 加入下限保護
                            this.state.p_hp = Math.max(0, this.state.p_hp - 20);
                            msg = USER_LANG === 'zh' ? "陷阱！你受傷了。" : "It was a trap! You took 20 damage.";
                            this.showDamagePopup(20, 'p-kao');
                        }
                        break;
                    case 'monster_eat': {
                        const roll = Math.random();
                        if (roll < 0.35) {
                            // [修正P2] 加入下限保護
                            this.state.p_hp = Math.max(0, this.state.p_hp - 10);
                            msg = USER_LANG === 'zh' ? '肚子一陣劇痛！你損失了 10 HP。' : 'Stomach cramps! You lost 10 HP.';
                            this.showDamagePopup(10, 'p-kao');
                        } else if (roll < 0.70) {
                            msg = USER_LANG === 'zh' ? '嗯...沒什麼特別的感覺，但身上散發的氣味讓小仙女躲得遠遠的。' : 'Nothing happened, but the smell made the Fairy keep her distance.';
                        } else {
                            // [修正] 永久增加基礎最大HP，不會被戰鬥重置
                            this.state.baseMaxHp += 15;
                            this.state.p_max += 15;
                            this.state.p_hp = this.state.p_max;
                            msg = USER_LANG === 'zh' ? '一股力量湧出！HP 上限增加 15 點！' : 'Power surges! Max HP increased by 15!';
                            this.showDamagePopup(15, 'p-kao', { isHeal: true });
                        }
                        break;
                    }
                    case 'monster_decline': {
                        if (Math.random() < 0.50) {
                            msg = USER_LANG === 'zh' ? '怪物廚師失望地收拾餐車離開了...' : 'The Monster Chef sadly packed up and left...';
                        } else {
                            msg = USER_LANG === 'zh' ? '怪物廚師怒了！「你竟敢拒絕我的料理！」' : 'The Monster Chef is furious! "How dare you refuse my dish!"';
                            this.showEventResult(msg);
                            // [修正] 設置待處理戰鬥標記，防止 confirmEventResult 推進流程
                            this.state.pendingBattle = true;
                            const enemy = Generator.genEnemy(this.state.stage || 4);
                            enemy.name = { en: 'Angry Chef', zh: '憤怒廚師' };
                            enemy.kao = '(╬ Ò﹏Ó)🔪';
                            setTimeout(() => this.startBattle(enemy), 1500);
                            return;
                        }
                        break;
                    }
                    case 'get_bone': {
                        const boneRelic = C_RELICS.find(r => r.id === 'r_bone');
                        if (boneRelic) {
                            this.state.relics.push(boneRelic);
                        }
                        break;
                    }
                    case 'puppy_share': {
                        this.state.p_hp = Math.min(this.state.p_hp + 25, this.state.p_max);
                        this.state.gold += 50;
                        this.showDamagePopup(25, 'p-kao', { isHeal: true });
                        break;
                    }
                    case 'master_chef_eat': {
                        const roll = Math.random();
                        if (roll < 0.5) {
                            this.state.baseMaxHp += 30;
                            this.state.p_max += 30;
                            this.state.p_hp = Math.min(this.state.p_hp + 50, this.state.p_max);
                            msg = USER_LANG === 'zh' ? '簡直是人間美味！最大生命 +30，回復了 50 HP。' : 'Heavenly delicious! Max HP +30, restored 50 HP.';
                            this.showDamagePopup(30, 'p-kao', { isHeal: true });
                        } else {
                            this.state.p_hp = Math.max(0, this.state.p_hp - 30);
                            msg = USER_LANG === 'zh' ? '太辛辣了！你的腸胃翻江倒海，損失了 30 HP。' : 'Too spicy! Your stomach is burning, you lost 30 HP.';
                            this.showDamagePopup(30, 'p-kao');
                        }
                        break;
                    }
                    case 'master_chef_fight': {
                        msg = USER_LANG === 'zh' ? '「受死吧！嚐嚐我的憤怒！」' : '"Die! Taste my wrath!"';
                        this.showEventResult(msg);
                        this.state.pendingBattle = true;
                        const enemy = Generator.genEnemy(this.state.stage || 4);
                        enemy.name = { en: 'Grand Chef Master', zh: '傳奇廚神' };
                        enemy.kao = '(ง •̀_•́)ง🍳🔥';
                        enemy.hp = Math.floor(enemy.hp * 1.5);
                        enemy.atk = Math.floor(enemy.atk * 1.2);
                        enemy.isElite = true;
                        setTimeout(() => this.startBattle(enemy), 1500);
                        return;
                    }
                    case 'dragon_gate':
                        this.startDragonGate(); return;
                    case 'puzzle':
                        this.startFairyTrial(); return;
                    case 'leave':
                        // [修正P2] 明確聲明 'leave' type（不做任何事，直接顯示結果）
                        break;
                }
                if (this.state.p_hp <= 0) { this.gameOver(false); return; }
                this.showEventResult(msg);
            },

            showEventResult: function (text) { document.getElementById('event-result-msg').innerText = text; document.getElementById('modal-event-result').classList.remove('hidden'); },

            addRandomRelic: function () { let pool = C_RELICS; this.state.relics.push(pool[Utils.randInt(0, pool.length - 1)]); },

            // ============================================================
            // [新增] 小仙女的考驗 - 解謎小遊戲
            // ============================================================
            genPuzzle: function () {
                const types = ['straight', 'flush', 'even', 'odd'];
                const type = Utils.pick(types);
                let question = []; // 4 張題目牌
                let answer = null; // 正確答案
                let wrongCards = []; // 7 張錯誤牌

                if (type === 'straight') {
                    // 找順子：給 4 張連續牌，找第 5 張
                    const startVal = Utils.randInt(2, 9); // 2-9 起始，確保能組成 5 張順子
                    const suits = [Utils.pick(SUITS), Utils.pick(SUITS), Utils.pick(SUITS), Utils.pick(SUITS)];
                    for (let i = 0; i < 4; i++) {
                        const val = startVal + i;
                        const rank = RANKS[val - 2];
                        question.push({ suit: suits[i], rank: rank, val: val });
                    }
                    // 正確答案：第 5 張
                    const ansVal = startVal + 4;
                    const ansRank = RANKS[ansVal - 2];
                    answer = { suit: Utils.pick(SUITS), rank: ansRank, val: ansVal };
                    // 生成 7 張錯誤牌（排除正確答案的 rank）
                    const usedRanks = question.map(c => c.rank).concat([ansRank]);
                    const availRanks = RANKS.filter(r => !usedRanks.includes(r));
                    for (let i = 0; i < 7; i++) {
                        wrongCards.push({ suit: Utils.pick(SUITS), rank: availRanks[i % availRanks.length], val: Data.VALUES[availRanks[i % availRanks.length]] });
                    }
                } else if (type === 'flush') {
                    // 找同花：給 4 張同花色，找第 5 張同花
                    const flushSuit = Utils.pick(SUITS);
                    const shuffledRanks = [...RANKS]; Utils.shuffle(shuffledRanks);
                    for (let i = 0; i < 4; i++) {
                        question.push({ suit: flushSuit, rank: shuffledRanks[i], val: Data.VALUES[shuffledRanks[i]] });
                    }
                    answer = { suit: flushSuit, rank: shuffledRanks[4], val: Data.VALUES[shuffledRanks[4]] };
                    // 錯誤牌：其他花色的牌
                    const otherSuits = SUITS.filter(s => s !== flushSuit);
                    for (let i = 0; i < 7; i++) {
                        const ws = Utils.pick(otherSuits);
                        wrongCards.push({ suit: ws, rank: Utils.pick(RANKS), val: Data.VALUES[Utils.pick(RANKS)] });
                    }
                } else if (type === 'even') {
                    // 找偶數：給 4 張偶數牌，找第 5 張偶數
                    const evenRanks = ['2', '4', '6', '8', '10', 'Q']; // val: 2,4,6,8,10,12
                    const oddRanks = ['3', '5', '7', '9', 'J', 'K', 'A'];
                    Utils.shuffle(evenRanks);
                    for (let i = 0; i < 4; i++) {
                        question.push({ suit: Utils.pick(SUITS), rank: evenRanks[i], val: Data.VALUES[evenRanks[i]] });
                    }
                    answer = { suit: Utils.pick(SUITS), rank: evenRanks[4], val: Data.VALUES[evenRanks[4]] };
                    for (let i = 0; i < 7; i++) {
                        wrongCards.push({ suit: Utils.pick(SUITS), rank: oddRanks[i % oddRanks.length], val: Data.VALUES[oddRanks[i % oddRanks.length]] });
                    }
                } else { // odd
                    // 找奇數：給 4 張奇數牌，找第 5 張奇數
                    const oddRanks = ['3', '5', '7', '9', 'J', 'K', 'A']; // val: 3,5,7,9,11,13,14
                    const evenRanks = ['2', '4', '6', '8', '10', 'Q'];
                    Utils.shuffle(oddRanks);
                    for (let i = 0; i < 4; i++) {
                        question.push({ suit: Utils.pick(SUITS), rank: oddRanks[i], val: Data.VALUES[oddRanks[i]] });
                    }
                    answer = { suit: Utils.pick(SUITS), rank: oddRanks[4], val: Data.VALUES[oddRanks[4]] };
                    for (let i = 0; i < 7; i++) {
                        wrongCards.push({ suit: Utils.pick(SUITS), rank: evenRanks[i % evenRanks.length], val: Data.VALUES[evenRanks[i % evenRanks.length]] });
                    }
                }

                // 組合 8 張桌面牌（1 正確 + 7 錯誤），並賦予 id
                let tableCards = [answer, ...wrongCards];
                Utils.shuffle(tableCards);
                tableCards = tableCards.map((c, i) => ({ ...c, id: i }));

                // 記錄正確答案的 index
                const answerIdx = tableCards.findIndex(c => c.rank === answer.rank && c.suit === answer.suit);

                const typeKey = { straight: 'FAIRY_STRAIGHT', flush: 'FAIRY_FLUSH', even: 'FAIRY_EVEN', odd: 'FAIRY_ODD' };
                return { type, typeKey: typeKey[type], question, answer, answerIdx, table: tableCards };
            },

            startFairyTrial: function () {
                this.state.puzzleMode = true;
                this.state.selected = [];
                this.state.turn = 'player';
                this.state.tableMax = 8;

                const puzzle = this.genPuzzle();
                this.state.puzzle = puzzle;
                this.state.table = puzzle.table;
                this.state.deck = [];
                this.state.field = Data.FIELD_FACTORS[0]; // none

                this.showScene('scene-battle');
                this.renderUI();
                this.msg(T(puzzle.typeKey));
            },

            onPuzzleAnswer: async function () {
                if (this.state.selected.length !== 1) {
                    this.msg(T('MSG_SELECT_ONE'));
                    return;
                }
                const selIdx = this.state.selected[0];
                const selCard = this.state.table[selIdx];
                const puzzle = this.state.puzzle;

                // 檢查答案
                if (selCard.rank === puzzle.answer.rank && selCard.suit === puzzle.answer.suit) {
                    // 答對！
                    this.msg(T('FAIRY_CORRECT'));
                    this.state.puzzleMode = false;
                    await Utils.delay(1500);
                    // 過關
                    if (USE_STORY_MODE) {
                        this.nextStoryStep();
                    } else {
                        this.state.stage++;
                        this.genMap();
                    }
                } else {
                    // 答錯！扣血 + 換題
                    const dmg = 10;
                    this.state.p_hp -= dmg;
                    this.msg(T('FAIRY_WRONG'));
                    this.showDamagePopup(dmg, 'p-kao');
                    await Utils.delay(1000);

                    if (this.state.p_hp <= 0) { this.state.puzzleMode = false; this.gameOver(false); return; }

                    // 重新出題
                    const newPuzzle = this.genPuzzle();
                    this.state.puzzle = newPuzzle;
                    this.state.table = newPuzzle.table;
                    this.state.selected = [];
                    this.renderUI();
                    this.msg(T(newPuzzle.typeKey));
                }
            },

            onPuzzleSkip: function () {
                const newPuzzle = this.genPuzzle();
                this.state.puzzle = newPuzzle;
                this.state.table = newPuzzle.table;
                this.state.selected = [];
                this.renderUI();
                this.msg(T(newPuzzle.typeKey));
            },

            // ============================================================
            // [新增] 小狗射龍門 - In-Between 射龍門小遊戲
            // ============================================================
            genDragonGate: function () {
                // 隨機抽 3 張不同數值的牌
                const allRanks = [...RANKS]; // 2~A
                Utils.shuffle(allRanks);
                const pick3 = allRanks.slice(0, 3);
                const leftCard = { suit: Utils.pick(SUITS), rank: pick3[0], val: Data.VALUES[pick3[0]] };
                const rightCard = { suit: Utils.pick(SUITS), rank: pick3[1], val: Data.VALUES[pick3[1]] };
                const middleCard = { suit: Utils.pick(SUITS), rank: pick3[2], val: Data.VALUES[pick3[2]] };

                // 確保左邊數值 < 右邊數值（方便顯示）
                let lo = leftCard, hi = rightCard;
                if (lo.val > hi.val) { lo = rightCard; hi = leftCard; }

                // 判斷中間牌是否嚴格在兩者之間
                const isBetween = middleCard.val > lo.val && middleCard.val < hi.val;

                return { leftCard: lo, rightCard: hi, middleCard, isBetween };
            },

            startDragonGate: function () {
                this.state.dragonGateMode = true;
                this.state.dgRound = 1;
                this.state.dgScore = 0;
                this.state.dgTotal = 3;
                this.state.dgPuzzle = this.genDragonGate();
                this.state.dgRevealed = false;
                this.state.selected = [];
                this.state.turn = 'player';
                this.state.tableMax = 0;
                this.state.table = [];
                this.state.deck = [];
                this.state.field = Data.FIELD_FACTORS[0]; // none
                // 建立一個假敵人避免 renderUI 報錯

            startBattle: function (enemyGen, fixedLevel = null) {
                // [新增] 保存敵人數據用於重試
                this.state.lastBattleEnemy = { enemyGen, fixedLevel };

                BuffSys.clear(); this.state.selected = []; this.state.turn = 'player';

                let possibleFields = Data.FIELD_FACTORS.filter(f => !f.special); // 預設只選普通場地
                if (this.state.stage >= 6) possibleFields = Data.FIELD_FACTORS; // 6層後開放所有場地
                this.state.field = Utils.pick(possibleFields);

                if (fixedLevel) {
                    const fe = fixedLevel.enemy;
                    this.state.enemy = { id: 'fixed', name: fe.name, kao: fe.kao, hp: fe.hp, maxHp: fe.hp, atk: fe.atk, cd: fe.cd, maxCd: fe.cd, ai: fe.ai, isElite: false, skill: null };
                    this.state.tableMax = fixedLevel.tableMax; this.state.hint = fixedLevel.hint;

                        while (this.state.table.length < this.state.tableMax) this.state.table.push(null);
                    } else {
                        if (!this.state.customDeck) this.state.customDeck = this.createBaseDeck();

                        this.state.table = Array(this.state.tableMax).fill(null);

                    // 進入普通或劇情戰鬥
                    this.state.enemy = enemyGen;

                    // [新增防呆] 如果資料沒寫 maxHp 或 kao，自動用當前數值補齊，避免顯示 undefined
                    if (!this.state.enemy.maxHp) this.state.enemy.maxHp = this.state.enemy.hp;

                    // [修正] 重置敵人血量，避免第二次遊玩時血量沒有重置的問題
                    this.state.enemy.hp = this.state.enemy.maxHp;
                    this.state.enemy.cd = this.state.enemy.maxCd;

                    this.state.tableMax = 8;
                    this.state.hint = "";
                    if (!this.state.customDeck) this.state.customDeck = this.createBaseDeck();
                    this.state.deck = JSON.parse(JSON.stringify(this.state.customDeck));
                    Utils.shuffle(this.state.deck);
                    this.state.table = Array(this.state.tableMax).fill(null);
                    this.dealTable();
                }
                // [修正] 使用 baseMaxHp 而非硬編碼 100，保留事件永久加成
                const bonus = this.getRelicBonus(); this.state.p_max = this.state.baseMaxHp + bonus.hp; this.state.discLeft = 3 + bonus.disc;
                this.showScene('scene-battle'); this.renderUI(); this.msg(this.state.hint ? T(this.state.hint) : T('MSG_START'));
                this.state.logs = [];
                this.state.handsPlayedInBattle = {};
                this.state.auras = { windrunner: false, element: false, echo: false };
                this.state.turnCount = 1;
                // [新增] 重置戰鬥統計

                    totalDamage: 0,
                    handsPlayed: {},
                    discardsUsed: 0,
                    turnsPlayed: 0,

                // [V2.4] 敵人登場動畫

            },
            createDeck: function () { let d = []; let id = 0; for (let s of SUITS) for (let r of RANKS) d.push({ suit: s, rank: r, val: Data.VALUES[r], id: id++ }); d.push({ suit: 'j', rank: 'JO', val: 15, id: id++ }); d.push({ suit: 'j', rank: 'JO', val: 15, id: id++ }); return Utils.shuffle(d); },
            dealTable: function () { for (let i = 0; i < this.state.tableMax; i++) if (this.state.table[i] === null && this.state.deck.length > 0) this.state.table[i] = this.state.deck.pop(); },
            toggleCard: function (idx) {

            onDiscard: async function () {
                // [新增] 射龍門模式 → 不中
                if (this.state.dragonGateMode) { this.onDragonGateAnswer(false); return; }

                if (this.state.turn !== 'player') return;

                if (this.state.discLeft <= 0) { this.msg(T('MSG_NO_DISC')); return; }
                if (this.state.selected.length === 0) { this.msg(T('MSG_SELECT')); return; }
                const discardedIndices = [...this.state.selected];
                const hookCount = this.getRelicCount('r_hook');
                if (hookCount > 0) {
                    let dmg = discardedIndices.length * 2 * Math.min(3, hookCount); this.state.enemy.hp = Math.max(0, this.state.enemy.hp - dmg); this.msg(USER_LANG === 'zh' ? `🪝 毒鉤造成 ${dmg} 點傷害！` : `🪝 Hook: ${dmg} DMG!`);
                    // [新增] 記錄鉤子傷害到統計

                this.state.battleStats.discardsUsed++; // [新增] 記錄棄牌次數

            onPlay: async function () {
                // [新增] 射龍門模式 → 中
                if (this.state.dragonGateMode) { this.onDragonGateAnswer(true); return; }
                // [新增] 解謎模式 → 作答
                if (this.state.puzzleMode) { this.onPuzzleAnswer(); return; }
                if (this.state.turn !== 'player') return;
                if (this.state.selected.length === 0) { this.msg(T('MSG_SELECT')); return; }

                let cards = this.state.selected.map(i => this.state.table[i]);
                if (cards.find(c => BuffSys.isSuitBanned(c.suit))) { this.msg(T('MSG_SUIT_BAN')); return; }

                // [新增] 鬼魅卡自傷判定 (每張 -5 HP)
                const spectralCardsCount = cards.filter(c => c && c.enchant === 'spectral').length;
                if (spectralCardsCount > 0) {
                    const totalSelfDmg = spectralCardsCount * 5;
                    this.state.p_hp = Math.max(0, this.state.p_hp - totalSelfDmg);
                    this.msg(USER_LANG === 'zh' ? `🔮 鬼魅卡噬血自傷：-${totalSelfDmg} HP！` : `🔮 Spectral Card Self-damage: -${totalSelfDmg} HP!`);
                    this.showDamagePopup(totalSelfDmg, 'p-kao');
                    if (this.state.p_hp <= 0) {
                        this.renderUI();
                        await Utils.delay(1000);
                        this.gameOver(false);
                        return;
                    }
                }

                const res = this.evalHand(cards);
                let multiplier = 1.0;

                // [修改] 場地效果判定
                const f = this.state.field;
                if (!this.hasRelic('r_umb')) {
                    if (f.suit && cards.some(c => c.suit === f.suit)) multiplier = f.rate;

                    // 特殊場地：重力 (Gravity) - 如果有 J,Q,K,A，傷害變 0.5倍
                    if (f.special === 'heavy' && cards.some(c => c.val >= 11)) {
                        multiplier = 0.5;
                        this.msg(USER_LANG === 'zh' ? "⚓ 重力異常：大牌（J,Q,K,A）傷害減半！" : "⚓ Gravity: Heavy cards weak!");
                        await Utils.delay(500);
                    }
                    // 特殊場地：荊棘 (Thorns) - 出牌扣血
                    if (f.special === 'pain') {
                        const selfDmg = 5;
                        this.state.p_hp -= selfDmg;
                        this.msg(USER_LANG === 'zh' ? `🌵 荊棘反噬：-${selfDmg} HP` : `🌵 Thorns: -${selfDmg} HP`);
                        this.showDamagePopup(selfDmg, 'p-kao');
                        // 檢查是否自殺
                        if (this.state.p_hp <= 0) { this.renderUI(); await Utils.delay(500); this.gameOver(false); return; }
                    }
                }

                // [新增] 戰鬥中牌型計數與光環解鎖檢查
                if (!this.state.handsPlayedInBattle[res.name]) {
                    this.state.handsPlayedInBattle[res.name] = 0;
                }
                this.state.handsPlayedInBattle[res.name]++;

                if (!this.state.auras.windrunner && (this.state.handsPlayedInBattle['Straight'] || 0) >= 3) {
                    this.state.auras.windrunner = true;
                    this.state.discLeft += 2;
                    this.msg(USER_LANG === 'zh' ? "🌬️ 疾風光環激活：棄牌上限 +2！" : "🌬️ Windrunner Aura Activated: Discards +2!");
                }
                if (!this.state.auras.element && (this.state.handsPlayedInBattle['Flush'] || 0) >= 2) {
                    this.state.auras.element = true;
                    this.msg(USER_LANG === 'zh' ? "⚡ 元素光環激活：倍率（Mult）固定 +3！" : "⚡ Element Aura Activated: Mult +3!");
                }
                if (!this.state.auras.echo && ((this.state.handsPlayedInBattle['Pair'] || 0) + (this.state.handsPlayedInBattle['Two Pair'] || 0)) >= 4) {
                    this.state.auras.echo = true;
                    this.msg(USER_LANG === 'zh' ? "🔊 迴聲光環激活：每次出牌追加 +20 真實傷害！" : "🔊 Echo Aura Activated: Play deals +20 True DMG!");
                }

                let dmg = Math.floor(res.dmg * multiplier);
                if (this.hasRelic('r_dice')) dmg = Math.floor(dmg * (Math.random() < 0.5 ? 1.15 : 0.85));
                if (BuffSys.isWeak()) dmg = Math.floor(dmg * 0.5);

                // [新增] 迴聲光環追加 20 點真實傷害
                if (this.state.auras.echo) {
                    dmg += 20;
                }

                if (dmg > this.state.maxDmg) this.state.maxDmg = dmg;
                this.state.enemy.hp = Math.max(0, this.state.enemy.hp - dmg);
                this.showDamagePopup(dmg, 'e-kao', { isCrit: dmg > 50 });

                // [新增] 記錄統計
                this.state.battleStats.totalDamage += dmg;
                if (!this.state.battleStats.handsPlayed[res.name]) {
                    this.state.battleStats.handsPlayed[res.name] = 0;
                }
                this.state.battleStats.handsPlayed[res.name]++;

                // [UI] 顯示場地名稱提示
                const fieldNameMap = {
                    'Club+': { en: 'Club+', zh: '梅花+' },
                    'Dia+': { en: 'Dia+', zh: '方塊+' },
                    'Hrt+': { en: 'Hrt+', zh: '紅心+' },
                    'Spd+': { en: 'Spd+', zh: '黑桃+' }
                };
                const localizedFieldName = fieldNameMap[f.name] ? (fieldNameMap[f.name][USER_LANG] || fieldNameMap[f.name]['en']) : f.name;
                const fieldTag = f.special ? ` [${f.icon}]` : (multiplier !== 1 ? ` (${localizedFieldName})` : '');
                this.msg(`${T(HAND_KEY_MAP[res.name]) || res.name}: ${dmg}${fieldTag}`);

                // [新增] 玻璃卡碎裂檢查
                cards.forEach(c => {
                    if (c && c.enchant === 'glass') {
                        if (Math.random() < 0.25) {
                            if (this.state.customDeck) {
                                const origIdx = this.state.customDeck.findIndex(origCard => origCard.id === c.id);
                                if (origIdx !== -1) {
                                    this.state.customDeck.splice(origIdx, 1);
                                }
                            }
                            this.msg(USER_LANG === 'zh' ? `💥 玻璃卡 [${c.rank}${Data.SUIT_META[c.suit].sym}] 碎裂粉碎了！` : `💥 Glass Card [${c.rank}${Data.SUIT_META[c.suit].sym}] shattered!`);
                            this.showDamagePopup(0, 'p-kao', { text: 'SHATTERED!' });
                        }
                    }
                });

                this.state.selected.forEach(idx => this.state.table[idx] = null);
                this.state.selected = []; BuffSys.tick(); this.renderUI(); await Utils.delay(1000);
                if (this.state.enemy.hp <= 0) this.win(); else this.endTurn();
            },
            endTurn: async function () {
                if (this.hasRelic('r_band')) {

                if (this.state.field.special === 'shuffle' && !this.hasRelic('r_umb')) {
                    this.msg(USER_LANG === 'zh' ? "🌀 暴風干擾：桌面手牌強制洗牌！" : "🌀 Storm: Table shuffled!");
