                    await Utils.delay(800);
                }

                this.dealTable(); this.state.turn = 'enemy'; this.renderUI(); await Utils.delay(1000);

                // 1. 敵人冷卻扣減與攻擊判定
                this.state.enemy.cd--;
                if (this.state.enemy.cd <= 0) { await this.enemyAttack(); this.state.enemy.cd = this.state.enemy.maxCd; }
                else { this.msg(`${T(this.state.enemy.name)} ${T('MSG_WAIT')}`); await Utils.delay(1000); }

                // 2. 死亡與結束判定
                if (this.state.p_hp <= 0) { this.gameOver(false); return; }
                if (this.state.table.every(c => c === null) && this.state.deck.length === 0) {
                    if (this.state.p_hp > this.state.enemy.hp) this.win(); else this.gameOver(false); return;
                }

                // 3. 準備下一回合，並增加回合計數器 (turnCount)
                this.dealTable();
                this.state.turn = 'player';
                this.state.turnCount++; // [關鍵修正] 在這裡增加戰鬥日誌的回合數
                this.state.battleStats.turnsPlayed++; // [新增] 記錄玩家回合數
                this.renderUI();
                this.msg(T('MSG_YOUR_TURN'));
            },
            enemyAttack: async function () {
                const valid = this.state.table.map((c, i) => c !== null ? i : -1).filter(i => i !== -1);
                if (valid.length === 0) { this.msg(T('MSG_ENEMY_NO_CARD')); return; }
                let picked = []; const type = this.state.enemy.ai; const lock = Math.min(3, this.getRelicCount('r_lock'));
                if (type === Data.AI_TYPES.RANDOM) {
                    let n = Utils.randInt(1, Math.min(Math.max(1, 3 - lock), valid.length));
                    let pool = [...valid]; for (let k = 0; k < n; k++) { let r = Utils.randInt(0, pool.length - 1); picked.push(pool[r]); pool.splice(r, 1); }
                } else if (type === Data.AI_TYPES.MAX_HAND) { picked = this.aiFindBestMatch(valid).slice(0, Math.max(1, 5 - lock)); } else {
                    let maxIdx = valid[0]; for (let i of valid) if (this.state.table[i].val > this.state.table[maxIdx].val) maxIdx = i; picked.push(maxIdx);
                }
                let cards = picked.map(i => this.state.table[i]); const res = this.evalHand(cards);
                let mul = 1.0; if (this.state.field.suit && cards.some(c => c.suit === this.state.field.suit)) mul = this.state.field.rate;
                let dmg = Math.floor(res.dmg * mul);
                
                // [新增] 鋼鐵卡被動減傷判定（每張留在桌面上的鋼鐵卡抵消 10 點傷害）
                const steelCardsCount = this.state.table.filter(c => c !== null && c.enchant === 'steel').length;
                if (steelCardsCount > 0 && dmg > 0) {
                    const reduction = steelCardsCount * 10;
                    dmg = Math.max(0, dmg - reduction);
                    this.msg(USER_LANG === 'zh' ? `🛡️ 鋼鐵防護：抵消了 ${reduction} 點受到的傷害！` : `🛡️ Steel Protection: -${reduction} DMG!`);
                }

                if (this.hasRelic('r_gene') && res.name === 'Pair') { dmg = 0; this.msg(T('MSG_BLOCK')); this.showDamagePopup(0, 'p-kao', { text: 'BLOCKED!' }); }
                else if (this.hasRelic('r_boot') && Math.random() < 0.1) { dmg = 0; this.msg(T('MSG_DODGE')); this.showDamagePopup(0, 'p-kao', { text: 'DODGE!' }); }
                else {
                    if (this.hasRelic('r_helm')) dmg = Math.max(0, dmg - 10);
                    this.state.p_hp = Math.max(0, this.state.p_hp - dmg);
                    let sLog = this.triggerEnemySkill(); this.msg(`${T(this.state.enemy.name)}: ${T(HAND_KEY_MAP[res.name]) || res.name} (${dmg})${sLog}`);
                    this.showDamagePopup(dmg, 'p-kao');
                }
                picked.forEach(idx => this.state.table[idx] = null); this.renderUI(); await Utils.delay(1500);
            },
            triggerEnemySkill: function () {
                const e = this.state.enemy; if (!e.skill || !Utils.chance(0.5)) return "";
                const sk = e.skill; let log = "";
                switch (sk.type) {
                    case 'ban_suit': const suit = SUITS[Utils.randInt(0, 3)]; BuffSys.add('ban_suit', suit, 2, 'BAN'); log = USER_LANG === 'zh' ? ` [禁色]` : ` [BAN]`; break;
                    case 'no_disc': BuffSys.add('no_disc', null, 2, 'LOCK'); log = USER_LANG === 'zh' ? ` [鎖棄]` : ` [LOCK]`; break;
                    case 'weak': BuffSys.add('weak', null, 1, 'WEAK'); log = USER_LANG === 'zh' ? ` [虛弱]` : ` [WEAK]`; break;
                } return log;
            },
            aiFindBestMatch: function (valid) {
                let counts = {}; valid.forEach(idx => { const c = this.state.table[idx]; let k = c.val; if (c.rank === 'JO') k = 99; if (!counts[k]) counts[k] = []; counts[k].push(idx); });
                let keys = Object.keys(counts).sort((a, b) => counts[b].length - counts[a].length || b - a); return counts[keys[0]].slice(0, 5);
            },
            checkStraight: function (cards) {
                if (cards.length < 5) return false; let jokers = cards.filter(c => c.rank === 'JO').length; let u = [...new Set(cards.filter(c => c.rank !== 'JO').map(c => c.val))].sort((a, b) => a - b);
                if (u.length === 0 && jokers >= 5) return true; if (u.includes(14)) u.unshift(1); let needed = 5 - jokers; if (needed <= 0) return true;
                for (let i = 0; i <= u.length - needed; i++) { let sub = u.slice(i, i + needed); if (sub[sub.length - 1] - sub[0] <= 4) return true; } return false;
            },
            evalHand: function (cards) {
                // [修改] 鬼魅卡 (Spectral Card) 作為萬能牌 Wildcard，其餘卡牌作為正常牌
                let jokers = cards.filter(c => c.rank === 'JO' || c.enchant === 'spectral').length;
                let normal = cards.filter(c => c.rank !== 'JO' && c.enchant !== 'spectral').sort((a, b) => b.val - a.val);
                let sum = cards.reduce((a, c) => a + (c.val === 15 || c.enchant === 'spectral' ? 0 : c.val), 0);
                
                let counts = {}, suits = {};
                normal.forEach(c => { counts[c.rank] = (counts[c.rank] || 0) + 1; suits[c.suit] = (suits[c.suit] || 0) + 1; });
                
                let isFlush = false, flushSuit = null, maxSuit = 0;
                for (let s in suits) if (suits[s] > maxSuit) { maxSuit = suits[s]; flushSuit = s; }
                if (maxSuit + jokers >= 5) isFlush = true;
                
                let isStraight = this.checkStraight(cards);
                let isStrFlush = false;
                if (isFlush && isStraight) {
                    let fCards = cards.filter(c => c.rank === 'JO' || c.enchant === 'spectral' || c.suit === flushSuit);
                    if (fCards.length >= 5 && this.checkStraight(fCards)) isStrFlush = true;
                }
                
                let cVals = Object.values(counts).sort((a, b) => b - a);
                let maxC = (cVals[0] || 0) + jokers;
                let name = "High Card";
                if (maxC >= 5) name = "Five of a Kind";
                else if (isStrFlush) name = "Straight Flush";
                else if (maxC === 4) name = "Four of a Kind";
                else if (maxC >= 3 && (cVals[1] || 0) >= 2 && cards.length >= 5) name = "Full House";
                else if (isFlush) name = "Flush";
                else if (isStraight) name = "Straight";
                else if (maxC === 3) name = "Three of a Kind";
                else if ((cVals[0] || 0) >= 2 && (cVals[1] || 0) >= 2) name = "Two Pair";
                else if (maxC === 2) name = "Pair";
                
                let base = Data.HAND_SCORES[name];
                const bonus = this.getRelicBonus();

                // [新增] 黃金卡額外提供 +30 基礎分數/籌碼
                let goldChips = cards.filter(c => c.enchant === 'gold').length * 30;

                // [新增] 計算基礎傷害，納入黃金卡額外點數與元素光環加成
                let multVal = base[1] + bonus.mult;
                if (this.state.auras.element) {
                    multVal += 3;
                }
                let dmg = (base[0] + bonus.chip + this.state.trainBonus + sum + goldChips) * multVal;

                // [新增] 1. 花色石加成
                const usedSuits = cards.map(c => c.suit).filter(s => s !== 'j' && s !== 'JO');
                let suitBonus = 0;
                this.state.relics.forEach(r => {
                    usedSuits.forEach(suit => {
                        const key = `suit_boost_${suit}`;
                        if (r.effect[key]) suitBonus += dmg * r.effect[key];
                    });
                });
                dmg += Math.floor(suitBonus);

                // [新增] 2. 特性效果
                if (this.state.enemy && this.state.enemy.trait && usedSuits.includes(this.state.enemy.trait.suit)) {
                    if (this.state.enemy.trait.type === 'immune') {
                        dmg = 0;
                    } else if (this.state.enemy.trait.type === 'weakness') {
                        dmg = Math.floor(dmg * 1.5);
                    }
                }

                // [新增] 3. 玻璃卡翻倍效果 (可加乘疊加)
                let glassMult = 1.0;
                cards.forEach(c => {
                    if (c.enchant === 'glass') glassMult *= 2.0;
                });
                dmg = Math.floor(dmg * glassMult);

                return { name: name, dmg: dmg };
            },

            win: function () {
                this.state.killCount++;

                if (this.state.enemy) {
                    if (this.state.enemy.kao === '(╬ Ò﹏Ó)🔪') {
                        this.state.chefDefeated = true;
                    }
                    if (this.state.enemy.kao === '(ง •̀_•́)ง🍳🔥') {
                        this.state.masterChefDefeated = true;
                        this.state.masterChefBattle = true;
                    }
                }

                let baseGold = this.state.enemy.isElite ? 60 : 30;
                let randomBonus = this.state.enemy.isElite ? Utils.randInt(0, 20) : Utils.randInt(0, 10);
                let goldEarned = baseGold + randomBonus;

                const HAND_GOLD_BONUS = {
                    'Five of a Kind': 50,
                    'Straight Flush': 40,
                    'Four of a Kind': 30,
                    'Full House': 20,
                    'Flush': 15,
                    'Straight': 15,
                    'Three of a Kind': 10,
                    'Two Pair': 5,
                    'Pair': 2,
                    'High Card': 0
                };
                let maxBonus = 0;
                let highestHand = "";
                for (let handName in this.state.battleStats.handsPlayed) {
                    if (this.state.battleStats.handsPlayed[handName] > 0) {
                        let bonus = HAND_GOLD_BONUS[handName] || 0;
                        if (bonus > maxBonus) {
                            maxBonus = bonus;
                            highestHand = handName;
                        }
                    }
                }
                goldEarned += maxBonus;
                this.state.gold += goldEarned;

                this.state.battleStats.goldEarned = goldEarned;
                this.state.battleStats.highestHand = highestHand;
                this.state.battleStats.maxBonus = maxBonus;

                let legendaryRelic = null;
                if (this.state.masterChefBattle) {
                    this.state.masterChefBattle = false;
                    const threeStarRelics = C_RELICS.filter(r => r.rarity === 3);
                    legendaryRelic = Utils.pick(threeStarRelics);
                    if (legendaryRelic) {
                        this.state.relics.push(legendaryRelic);
                    }
                }

                this.showBattleReport();

                const wasStoryBattle = (USE_STORY_MODE && this.state.battleRewardRule);

                setTimeout(() => {
                    if (legendaryRelic) {
                        const msg = USER_LANG === 'zh' 
                            ? `🎉 傳奇廚神被擊敗！獲得了傳奇遺物：[${T(legendaryRelic.name)}]！` 
                            : `🎉 Grand Chef Master defeated! Gained legendary relic: [${T(legendaryRelic.name)}]!`;
                        this.showEventResult(msg);
                        return;
                    }

                    if (wasStoryBattle && this.state.battleRewardRule.type === 'fixed') {
                        const relic = C_RELICS.find(r => r.id === this.state.battleRewardRule.id);
                        if (relic) {
                            this.state.relics.push(relic);
                            const msg = `${T('VICTORY')}! ${T('GET')}: ${T(relic.name)}`;
                            this.state.battleRewardRule = null;
                            this.showEventResult(msg);
                        } else {
                            this.state.battleRewardRule = null;
                            this.nextStoryStep();
                        }
                    } else {
                        this.state.battleRewardRule = null;
                        this.showRewards(this.state.enemy.isElite);
                    }
                }, 3000);
            },

                const sec = duration % 60;

                // 2. 根據層數給予「稱號」 (Gamification)
                let rank = "Novice 菜鳥";
                if (this.state.stage > 3) rank = "Adventurer 冒險者";
                if (this.state.stage > 7) rank = "Veteran 老手";
                if (this.state.stage > 12) rank = "Master 大師";

                            <div style="font-size:12px; margin-bottom:5px;">🎒 RELICS 遺物 (${this.state.relics.length})</div>
                            <div class="relic-grid">${relicHtml}</div>

            // [新增] 計算評分
            calculateRating: function (stats, efficiency) {
                // 評分標準：
                // S: 平均傷害 >= 150, 棄牌 <= 2
                // A: 平均傷害 >= 100, 棄牌 <= 4
                // B: 平均傷害 >= 70
                // C: 平均傷害 >= 50
                // D: 其他

                const avgDmg = stats.turnsPlayed > 0 ? (stats.totalDamage / stats.turnsPlayed) : 0;

                let grade = 'D';
                let stars = '★☆☆☆☆';
                let label = 'RATING_D';

                if (avgDmg >= 150 && stats.discardsUsed <= 2) {
                    grade = 'S';
                    stars = '★★★★★';
                    label = 'RATING_S';
                } else if (avgDmg >= 100 && stats.discardsUsed <= 4) {
                    grade = 'A';
                    stars = '★★★★☆';
                    label = 'RATING_A';
                } else if (avgDmg >= 70) {
                    grade = 'B';
                    stars = '★★★☆☆';
                    label = 'RATING_B';
                } else if (avgDmg >= 50) {
                    grade = 'C';
                    stars = '★★☆☆☆';
                    label = 'RATING_C';
                }

                return { grade, stars, label };
            },

            /**
             * 顯示傷害飄動數字
             * @param {number} damage - 傷害數值
             * @param {string} targetId - 目標元素 ID ('e-kao' 敵人 / 'p-kao' 玩家)
             * @param {object} options - 可選參數
             * @param {boolean} options.isCrit - 是否暴擊
             * @param {boolean} options.isHeal - 是否治療（顯示綠色）
             * @param {string} options.text - 自訂文字（如 "MISS", "BLOCK"）
             */
            showDamagePopup: function (damage, targetId, options = {}) {
                const target = document.getElementById(targetId);
                if (!target) return;

                // 取得目標位置
                const rect = target.getBoundingClientRect();
                const container = document.getElementById('scene-battle');
                const containerRect = container.getBoundingClientRect();

                // 建立飄動元素
                const popup = document.createElement('div');
                popup.className = 'damage-popup';

                // 設定樣式類別
                if (options.isCrit) popup.classList.add('crit');
                if (options.isHeal) popup.classList.add('heal');
                if (options.text) popup.classList.add('text-only');

                // 設定內容
                popup.textContent = options.text || (options.isHeal ? `+${damage}` : `-${damage}`);

                // 隨機水平偏移（避免多個數字重疊）
                const offsetX = (Math.random() - 0.5) * 40;

                // 計算位置（相對於戰鬥容器）
                popup.style.left = `${rect.left - containerRect.left + rect.width / 2 + offsetX}px`;
                popup.style.top = `${rect.top - containerRect.top + rect.height / 2}px`;

                // 加入容器
                container.appendChild(popup);

                // 動畫結束後移除
                popup.addEventListener('animationend', () => {
                    popup.remove();
                });
            }
        };
